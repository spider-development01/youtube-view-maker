<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bing Search Automation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Bing Search Automation</h2>
        <input type="number" id="numSearches" placeholder="Number of Searches" max="40" min="1" value="15">
        <button id="startSearches">Start Searches</button>
        <button id="stopSearches">Stop Searches</button>
        <button id="closeTabs">Close All Tabs</button>

        <button class="rewards-button" onclick="goToRewards()">Go to Microsoft Rewards</button>

        <div id="loader-container">
            <p id="loader-message">Loading...</p>
            <div id="progress-bar"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
